<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CakeFlow Unslop Story</title>
  <meta name="unslop-steps" content="Spacing and Layout, Color and surfaces, UTR Drama Removal, Quiet Typography and Details">
  <meta name="unslop-frame" content="0 0 440">
  <style>
    /* Step 0 - Original Slop */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #ffffff; color: #09090b; padding: 24px 16px; }
    .card { background: #f4f4f5; border-radius: 24px; padding: 18px 16px; margin-top: 14px; }
    .rainbow-btn { background: linear-gradient(135deg, #ff007a, #7928ca, #0070f3); color: #fff; padding: 8px 14px; border-radius: 9999px; font-weight: 700; border: none; }
    .moving-border { background: #fff; border: 2px solid #10b981; box-shadow: 0 0 14px rgba(16,185,129,0.5); padding: 8px 14px; border-radius: 12px; font-weight: 700; }
    .utr-green-box { background: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 16px; padding: 12px; margin-top: 12px; }

    /* Step 1 - Spacing */
    .s1 .card { padding: 20px 18px; margin-top: 16px; }
    .s1 .utr-green-box { margin-top: 14px; padding: 14px; }

    /* Step 2 - Color & Surfaces */
    .s2 .rainbow-btn { background: #09090b !important; border-radius: 12px; box-shadow: none; }
    .s2 .moving-border { background: #09090b !important; color: #fff !important; border: none !important; box-shadow: none !important; }

    /* Step 3 - Kill UTR & Clean UPI */
    .s3 .utr-green-box { background: #ffffff !important; border: 1px solid #e4e4e7 !important; border-radius: 14px; }

    /* Step 4 - Quiet Typography */
    .s4 * { text-transform: none !important; letter-spacing: normal !important; }
  </style>
</head>
<body>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="font-size:16px; font-weight:800;">CakeFlow POS</h2>
    <button class="rainbow-btn">+ New Order</button>
  </div>
  <div class="card">
    <h3 style="font-size:17px; font-weight:800;">1 Kg Chocolate Truffle</h3>
    <p style="font-size:12px; color:#71717a; margin-top:4px;">100% Eggless • Today • 6:00 PM - 7:00 PM</p>
    
    <div class="utr-green-box">
      <div style="font-size:11px; font-weight:800; color:#065f46;">
        <span class="swap" data-at="3">
          <span class="from">BANK UTR: ereqt3qt</span>
          <span class="to">Paid via UPI (Google Pay / PhonePe) ✓</span>
        </span>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px; pt:12px; border-top:1px solid #e4e4e7;">
      <div>
        <div style="font-size:10px; color:#71717a; text-transform:uppercase;">Handover balance</div>
        <div style="font-size:18px; font-weight:800; font-family:monospace;">₹749</div>
      </div>
      <button class="moving-border">Mark as Baked ✓</button>
    </div>
  </div>
</body>
</html>
